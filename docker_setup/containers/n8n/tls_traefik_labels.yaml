services:
  n8n:
    # ... (image, volumi, ecc.)
    labels:
      # --- Abilitazione e Rete ---
      traefik.enable: "true"
      traefik.docker.network: "cust_traefik"

      # --- Router (Come Traefik riceve il traffico) ---
      traefik.http.routers.n8n.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.n8n.entrypoints: "websecure"
      
      # --- Gestione TLS (HTTPS) ---
      traefik.http.routers.n8n.tls: "true"
      traefik.http.routers.n8n.tls.certresolver: "lets-encrypt"

      # Collega questo router al servizio definito sotto
      traefik.http.routers.n8n.service: "n8n"

      # --- Servizio (Dove Traefik inoltra il traffico) ---
      traefik.http.services.n8n.loadbalancer.server.port: 5678

    networks:
      - cust_traefik

networks:
  cust_traefik:
    external: true
